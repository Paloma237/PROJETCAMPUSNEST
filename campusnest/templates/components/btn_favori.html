{% if user.is_authenticated and user.role == "client" %}
  <form method="post" action="{% url 'favoris:toggle' chambre_pk=chambre.pk %}" class="inline-block">
    {% csrf_token %}
    <button type="submit" 
            title="{% if est_favori %}Retirer des favoris{% else %}Ajouter aux favoris{% endif %}"
            class="p-2 bg-white/90 backdrop-blur-sm rounded-full shadow-sm border border-gray-100 hover:bg-white transition-all duration-200">
        <svg class="w-5 h-5 transition-colors duration-200 {% if est_favori %}fill-rose-500 text-rose-500{% else %}text-gray-400 hover:text-rose-500{% endif %}" 
             fill="currentColor" viewBox="0 0 20 20">
            <path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"/>
        </svg>
    </button>
  </form>
{% endif %}
